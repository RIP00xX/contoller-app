name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a578f447d47000dd6478b3d766c\n" > $ANDROID_HOME/licenses/android-sdk-license
        printf "d56f5187479451eabf01fb78af6dfcb131a6481e\n" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Make gradlew executable
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug -x test --no-daemon --stacktrace 2>&1 | tee build_output.txt

    - name: Print Failure Summary
      if: failure()
      run: |
        echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 100 build_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build_output.txt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VirtualController-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk


